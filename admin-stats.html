<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>QueryMix — إحصائيات</title>
<style>
  :root{--bg:#f5f3fa;--card:#fff;--ink:#1a1033;--muted:#6b6580;--brand:#4b0082;--line:#e3dff0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:16px}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:20px;margin:8px 0 14px}
  .card{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(75,0,130,.08);margin-bottom:14px}
  .row{display:flex;gap:8px}
  input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;direction:ltr}
  button{padding:10px 16px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:inherit;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .k{background:var(--bg);border-radius:12px;padding:10px 12px}
  .k b{display:block;font-size:22px;color:var(--brand)}
  .k span{font-size:13px;color:var(--muted)}
  h2{font-size:15px;margin:0 0 8px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
  th{color:var(--muted);font-weight:600}
  td.n{direction:ltr;text-align:right}
  .err{color:#b00020;margin-top:8px}
  .hide{display:none}
  @media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 إحصائيات QueryMix</h1>

  <div class="card" id="loginBox">
    <div class="row">
      <input id="secret" type="password" placeholder="ADMIN_SECRET" autocomplete="off">
      <button id="go">عرض</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div id="out" class="hide">
    <div class="card">
      <h2>المستخدمون</h2>
      <div class="grid">
        <div class="k"><b id="uTotal">-</b><span>الإجمالي</span></div>
        <div class="k"><b id="uPrem">-</b><span>المشتركون</span></div>
        <div class="k"><b id="u7">-</b><span>جدد (7 أيام)</span></div>
        <div class="k"><b id="u30">-</b><span>جدد (30 يوم)</span></div>
      </div>
    </div>

    <div class="card">
      <h2>اليوم <span id="today" style="color:var(--muted);font-weight:400"></span></h2>
      <div class="grid">
        <div class="k"><b id="cMsg">-</b><span>رسائل</span></div>
        <div class="k"><b id="cUsers">-</b><span>مستخدمون نشطون</span></div>
        <div class="k"><b id="iImg">-</b><span>صور</span></div>
        <div class="k"><b id="saved">-</b><span>نتائج محفوظة (الكل)</span></div>
      </div>
    </div>

    <div class="card">
      <h2>آخر 14 يوم</h2>
      <table>
        <thead><tr><th>التاريخ</th><th>رسائل</th><th>نشطون</th><th>صور</th><th>تسجيلات</th></tr></thead>
        <tbody id="days"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const BACKEND_URL = "https://ai-compare-backend-x063.onrender.com";
const $ = (id) => document.getElementById(id);
const num = (v) => (v == null ? 0 : v);

async function load(secret) {
  $("err").textContent = "";
  $("go").disabled = true;
  try {
    const res = await fetch(BACKEND_URL + "/api/admin/stats", { headers: { "x-admin-secret": secret } });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(res.status === 403 ? "كلمة السر غير صحيحة" : (d.error || "خطأ " + res.status));

    $("uTotal").textContent = num(d.users.total);
    $("uPrem").textContent = num(d.users.premium);
    $("u7").textContent = num(d.users.new_7d);
    $("u30").textContent = num(d.users.new_30d);
    $("today").textContent = d.today;
    $("cMsg").textContent = num(d.chat_today.total);
    $("cUsers").textContent = num(d.chat_today.users);
    $("iImg").textContent = num(d.images_today.total);
    $("saved").textContent = num(d.saved_results);

    const map = {};
    const ensure = (k) => (map[k] = map[k] || { messages: 0, users: 0, images: 0, signups: 0 });
    d.chat_days.forEach((r) => { const m = ensure(r.date); m.messages = r.messages; m.users = r.users; });
    d.image_days.forEach((r) => { ensure(r.date).images = r.images; });
    d.signup_days.forEach((r) => { ensure(r.date).signups = r.signups; });
    const keys = Object.keys(map).sort().reverse();
    $("days").innerHTML = keys.length ? "" : '<tr><td colspan="5">ما كاين حتى نشاط بعد</td></tr>';
    keys.forEach((k) => {
      const m = map[k], tr = document.createElement("tr");
      [k, m.messages, m.users, m.images, m.signups].forEach((v, i) => {
        const td = document.createElement("td");
        if (i === 0) td.className = "n";
        td.textContent = v;
        tr.appendChild(td);
      });
      $("days").appendChild(tr);
    });

    $("loginBox").classList.add("hide");
    $("out").classList.remove("hide");
    try { sessionStorage.setItem("qm_admin", secret); } catch (e) {}
  } catch (e) {
    $("err").textContent = e.message || "وقع خطأ";
  } finally {
    $("go").disabled = false;
  }
}

$("go").onclick = () => { const s = $("secret").value.trim(); if (s) load(s); };
$("secret").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
try { const s = sessionStorage.getItem("qm_admin"); if (s) load(s); } catch (e) {}
</script>
</body>
</html>
