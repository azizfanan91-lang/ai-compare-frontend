        <textarea class="ta" id="sumText" data-i18n-ph="sumPh" style="margin-top:12px"></textarea>
        <div class="opts">
          <label class="opt"><span data-i18n="sumLen"></span>
            <select class="sel" id="sumLenSel">
              <option value="short" data-i18n="lenShort"></option>
              <option value="medium" data-i18n="lenMedium" selected></option>
              <option value="long" data-i18n="lenLong"></option>
            </select>
          </label>
          <label class="opt"><span data-i18n="sumFmt"></span>
            <select class="sel" id="sumFmtSel">
              <option value="para" data-i18n="fmtPara"></option>
              <option value="bullets" data-i18n="fmtBullets"></option>
            </select>
          </label>
        </div>
        <button class="btn btn-p run" id="sumRun" data-i18n="sumRun"></button>
        <div class="results compare-layout" id="sumResults" aria-live="polite"></div>
      </div>

      <!-- الوكلاء الجاهزون -->
      <div data-panel="agents" class="hidden">
        <div class="opts">
          <label class="opt"><span data-i18n="agentLabel"></span>
            <select class="sel" id="agentSel"></select>
          </label>
        </div>
        <p class="hint" id="agentDesc"></p>
        <textarea class="ta" id="agentText" data-i18n-ph="agentPh" maxlength="20000" style="margin-top:12px"></textarea>
        <button class="btn btn-p run" id="agentRun" data-i18n="agentRun"></button>
        <div class="results compare-layout" id="agentResults" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <section class="steps-box" id="how">
    <h2 class="section-title" data-i18n="howTitle"></h2>
    <div class="steps">
      <div class="step"><div class="num">1</div><h4 data-i18n="s1t"></h4><p data-i18n="s1d"></p></div>
      <div class="step"><div class="num">2</div><h4 data-i18n="s2t"></h4><p data-i18n="s2d"></p></div>
      <div class="step"><div class="num">3</div><h4 data-i18n="s3t"></h4><p data-i18n="s3d"></p></div>
      <div class="step"><div class="num">4</div><h4 data-i18n="s4t"></h4><p data-i18n="s4d"></p></div>
    </div>
  </section>

  <section id="pricing">
    <h2 class="section-title" data-i18n="pricingTitle"></h2>
    <p class="section-sub" data-i18n="pricingSub"></p>
    <div class="plans">
      <div class="plan">
        <h3 data-i18n="freePlan"></h3>
        <div class="price">0$ <small data-i18n="freePer"></small></div>
        <ul><li data-i18n="freeLi1"></li><li data-i18n="freeLi2"></li><li data-i18n="freeLi3"></li></ul>
        <button class="btn btn-w" id="freeBtn" data-i18n="freeBtn"></button>
      </div>
      <div class="plan hot">
        <h3 id="subscribeTitle" data-i18n="subscribeTitle"></h3>
        <div class="price">10$ <small data-i18n="premPer"></small></div>
        <ul><li data-i18n="premLi1"></li><li data-i18n="premLi2"></li><li data-i18n="premLi3"></li></ul>

        <!-- الدفع عبر Gumroad: نفس المنطق القديم -->
        <div class="sub-actions" id="subActions">
          <a class="btn btn-p" id="subscribeLink" target="_blank" rel="noopener" data-i18n="subscribeLinkText"></a>
          <button type="button" class="btn btn-w" id="checkSubBtn" data-i18n="checkSubText"></button>
        </div>
        <div class="prem-ok hidden" id="premiumOk" data-i18n="premiumLabel"></div>
        <div class="sub-status" id="subscribeStatus"></div>
      </div>
    </div>
  </section>

  <section id="faq" aria-labelledby="faqTitle">
    <h2 class="section-title" id="faqTitle" data-i18n="faqTitle"></h2>
    <p class="section-sub" data-i18n="faqSub"></p>
    <div class="faq">
      <details><summary data-i18n="faq1Q"></summary><div class="faq-a" data-i18n="faq1A"></div></details>
      <details><summary data-i18n="faq2Q"></summary><div class="faq-a" data-i18n="faq2A"></div></details>
      <details><summary data-i18n="faq3Q"></summary><div class="faq-a" data-i18n="faq3A"></div></details>
      <details><summary data-i18n="faq4Q"></summary><div class="faq-a" data-i18n="faq4A"></div></details>
      <details><summary data-i18n="faq5Q"></summary><div class="faq-a" data-i18n="faq5A"></div></details>
      <details><summary data-i18n="faq6Q"></summary><div class="faq-a" data-i18n="faq6A"></div></details>
      <details><summary data-i18n="faq7Q"></summary><div class="faq-a" data-i18n="faq7A"></div></details>
    </div>
  </section>

  <section class="cta">
    <div>
      <h2 data-i18n="ctaTitle"></h2>
      <p data-i18n="ctaText"></p>
    </div>
    <button class="btn btn-p" id="ctaBtn"><span class="arrow"></span> <span data-i18n="ctaBtnText"></span></button>
  </section>
</main>

<div class="modal" id="resetModal" role="dialog" aria-modal="true">
