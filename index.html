<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قارن بين نماذج الذكاء الاصطناعي - QueryMix</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --border: #334155;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(30, 41, 59, 0.8);
    }
    .auth-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-weight: bold;
    }
    main {
      flex: 1;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }
    .prompt-box {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text);
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 0.75rem;
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border);
    }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; }
    .form-group input {
      width: 100%;
      padding: 0.5rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }
    .premium-card {
      background: linear-gradient(135deg, #1e1b4b, #311042);
      border: 1px solid #6366f1;
      padding: 1.5rem;
      border-radius: 0.75rem;
      margin-top: 2rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h2>QueryMix AI</h2>
    <div id="user-status">
      <button class="auth-btn" onclick="openAuthModal()">تسجيل الدخول / حساب جديد</button>
    </div>
  </header>

  <main>
    <div class="prompt-box">
      <input type="text" id="prompt-input" placeholder="اطرح سؤالك لمقارنة النماذج..." />
      <button class="auth-btn" onclick="sendQuery()">إرسال</button>
    </div>

    <div id="results" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem;">
      <!-- الأجوبة من النماذج تظهر هنا -->
    </div>

    <div class="premium-card" id="paypal-container-card" style="display: none;">
      <h3>اشترك في Premium ($10/شهرياً)</h3>
      <p>أسئلة بلا حدود مع جميع النماذج</p>
      <div id="paypal-button-container" style="max-width: 300px; margin: 0 auto;"></div>
    </div>
  </main>

  <!-- Modal الدخول والتسجيل -->
  <div class="modal" id="auth-modal">
    <div class="modal-content">
      <h3 id="modal-title">تسجيل الدخول</h3>
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="auth-email" />
      </div>
      <div class="form-group">
        <label>كلمة السر</label>
        <input type="password" id="auth-password" />
      </div>
      <button class="auth-btn" style="width: 100%;" onclick="submitAuth()">متابعة</button>
      <p style="margin-top: 1rem; font-size: 0.875rem; text-align: center; cursor: pointer; color: #60a5fa;" onclick="toggleAuthMode()">
        <span id="toggle-auth-text">ما عندكش حساب؟ صاوب واحد</span>
      </p>
      <button onclick="closeAuthModal()" style="background: none; border: none; color: #94a3b8; width: 100%; margin-top: 0.5rem; cursor: pointer;">إلغاء</button>
    </div>
  </div>

  <script>
    // غير هاد الرابط برابط الـ Backend ديالك فـ Render
    const BACKEND_URL = https://ai-compare-backend-x063.onrender.com/
    let isSignup = false;

    function openAuthModal() { document.getElementById('auth-modal').classList.add('active'); }
    function closeAuthModal() { document.getElementById('auth-modal').classList.remove('active'); }
    
    function toggleAuthMode() {
      isSignup = !isSignup;
      document.getElementById('modal-title').innerText = isSignup ? 'حساب جديد' : 'تسجيل الدخول';
      document.getElementById('toggle-auth-text').innerText = isSignup ? 'عندك حساب؟ دخل من هنا' : 'ما عندكش حساب؟ صاوب واحد';
    }

    async function submitAuth() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const endpoint = isSignup ? '/api/auth/signup' : '/api/auth/login';

      try {
        const res = await fetch(BACKEND_URL + endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (data.token) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('userEmail', data.email);
          closeAuthModal();
          updateUI();
          initPayPal();
        } else {
          alert(data.error || 'وقع خطأ');
        }
      } catch (e) {
        alert('مشكل في الاتصال بالسيرفر');
      }
    }

    function updateUI() {
      const token = localStorage.getItem('token');
      const email = localStorage.getItem('userEmail');
      const statusDiv = document.getElementById('user-status');
      
      if (token && email) {
        statusDiv.innerHTML = `<span>${email}</span> <button class="auth-btn" style="background:#ef4444; margin-right:0.5rem;" onclick="logout()">خروج</button>`;
        document.getElementById('paypal-container-card').style.display = 'block';
      } else {
        statusDiv.innerHTML = `<button class="auth-btn" onclick="openAuthModal()">تسجيل الدخول / حساب جديد</button>`;
        document.getElementById('paypal-container-card').style.display = 'none';
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('userEmail');
      updateUI();
    }

    async function sendQuery() {
      const prompt = document.getElementById('prompt-input').value;
      const token = localStorage.getItem('token');
      
      if (!token) {
        openAuthModal();
        return;
      }
      if (!prompt) return;

      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<p>جاري جلب الإجابات...</p>';

      try {
        const res = await fetch(BACKEND_URL + '/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ model: 'openai/gpt-4o', prompt })
        });
        const data = await res.json();
        
        if (res.status === 429) {
          alert(data.error);
          document.getElementById('paypal-container-card').scrollIntoView();
          return;
        }

        resultsDiv.innerHTML = `
          <div style="background: var(--card-bg); padding: 1rem; border-radius: 0.5rem; border: 1px solid var(--border);">
            <h4>GPT-4o</h4>
            <p>${data.text || data.error}</p>
          </div>
        `;
      } catch (e) {
        alert('خطأ في الاتصال بالسيرفر');
      }
    }

    async function initPayPal() {
      try {
        const res = await fetch(BACKEND_URL + '/api/payment/config');
        const config = await res.json();
        
        if (!config.clientId || !config.planId) return;

        const script = document.createElement('script');
        script.src = `https://www.paypal.com/sdk/js?client-id=${config.clientId}&vault=true&intent=subscription`;
        script.onload = () => {
          paypal.Buttons({
            createSubscription: function(data, actions) {
              return actions.subscription.create({ 'plan_id': config.planId });
            },
            onApprove: async function(data, actions) {
              const token = localStorage.getItem('token');
              const res = await fetch(BACKEND_URL + '/api/payment/activate', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ subscriptionID: data.subscriptionID })
              });
              const result = await res.json();
              if (result.success) {
                alert('مبروك! تم تفعيل حساب Premium بنجاح.');
              }
            }
          }).render('#paypal-button-container');
        };
        document.body.appendChild(script);
      } catch (e) {
        console.error('فشل في تحضير PayPal:', e);
      }
    }

    // تشغيل عند تحميل الصفحة
    updateUI();
    if (localStorage.getItem('token')) initPayPal();
  </script>
</body>
</html>
