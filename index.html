<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="hT2FDh9OExjZR-fDaO2KDz0Flq1Nl5_4GmiH-NgwvW0" />
<title id="pageTitle">قارن بين النماذج</title>
<style>
  :root {
    --bg: #101314;
    --panel: #171b1d;
    --border: #262b2e;
    --text: #e8e6e1;
    --muted: #8a9296;
    --accent: #5ec8b8;
    --accent-dim: #2f4644;
    --danger: #e07a7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 20px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  header h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }

  /* Language switcher */
  .lang-switch {
    display: flex;
    gap: 4px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px;
    flex-shrink: 0;
  }
  .lang-btn {
    width: auto;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 600;
    background: transparent;
    color: var(--muted);
    border-radius: 16px;
  }
  .lang-btn.active { background: var(--accent); color: #08211d; }

  /* Auth */
  .auth-box {
    max-width: 380px;
    margin: 40px auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  .auth-box h2 { margin-top: 0; font-size: 18px; }
  input[type="password"], input[type="text"], input[type="email"], textarea {
    background: #0d1011;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 14px;
    font-family: inherit;
    width: 100%;
    margin-bottom: 10px;
  }
  textarea { min-height: 80px; resize: vertical; }
  button {
    background: var(--accent);
    color: #08211d;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border);
    margin-top: 8px;
  }
  .error { color: var(--danger); font-size: 13px; margin: 8px 0; min-height: 16px; }
  .switch-link { text-align: center; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .switch-link a { color: var(--accent); cursor: pointer; text-decoration: underline; }

  /* Top bar user info */
  .user-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .user-bar button { width: auto; padding: 6px 14px; font-size: 12px; }
  .usage-pill {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
  }

  /* Chat UI */
  .hidden { display: none; }
  .models { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    color: var(--muted);
    background: transparent;
    user-select: none;
    width: auto;
  }
  .chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .results { display: grid; gap: 14px; margin-top: 22px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card h3 { margin: 0 0 8px; font-size: 14px; color: var(--accent); }
  .card .body { font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  .muted { color: var(--muted); font-size: 13px; }
  .limit-banner {
    background: #2a1f1f;
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  /* Subscribe box */
  .subscribe-box {
    background: var(--panel);
    border: 1px solid var(--accent-dim);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
    text-align: center;
  }
  .subscribe-box h3 { margin: 0 0 6px; font-size: 16px; color: var(--accent); }
  .subscribe-box p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .subscribe-actions { max-width: 320px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  #subscribeLinkBtn {
    display: inline-block;
    text-decoration: none;
    box-sizing: border-box;
  }
  .subscribe-status {
    font-size: 13px;
    margin-top: 10px;
    min-height: 16px;
  }
  .subscribe-status.success { color: var(--accent); }
  .subscribe-status.error { color: var(--danger); }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="mainTitle">قارن بين نماذج الذكاء الاصطناعي</h1>
    <p id="subTitle">سؤال واحد، عدة نماذج، جوابات جنب بعض</p>
  </div>
  <div class="lang-switch">
    <button class="lang-btn" data-lang="ar">ع</button>
    <button class="lang-btn" data-lang="fr">FR</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>
</header>

<div class="container">

  <!-- Auth screens -->
  <div id="authSection">
    <div class="auth-box">
      <h2 id="authTitle">تسجيل الدخول</h2>
      <input type="email" id="authEmail" placeholder="الإيميل ديالك">
      <input type="password" id="authPassword" placeholder="كلمة السر">
      <div class="error" id="authError"></div>
      <button id="authSubmitBtn">دخول</button>
      <div class="switch-link">
        <span id="switchText">ما عندكش حساب؟</span>
        <a id="switchLink">صاوب واحد</a>
      </div>
    </div>
  </div>

  <!-- Main app (hidden until logged in) -->
  <div id="appSection" class="hidden">
    <div class="user-bar">
      <span id="userEmailLabel"></span>
      <div style="display:flex; gap:10px; align-items:center;">
        <span class="usage-pill" id="usagePill">...</span>
        <button id="logoutBtn">خروج</button>
      </div>
    </div>

    <div id="limitBanner" class="limit-banner hidden"></div>

    <!-- Subscribe box (يبان غير إلى المستخدم ماشي مشترك) -->
    <!-- Gumroad: subscription link + a manual "check status" button, since the
         webhook updates the DB in the background after checkout on Gumroad's site -->
    <div id="subscribeBox" class="subscribe-box hidden">
      <h3 id="subscribeTitle">اشترك فـ Premium</h3>
      <p id="subscribeDesc">10$ فالشهر — أسئلة بلا حدود مع كل النماذج</p>
      <div class="subscribe-actions">
        <a id="subscribeLinkBtn" target="_blank" rel="noopener">
          <button type="button" id="subscribeLinkBtnInner"></button>
        </a>
        <button type="button" class="secondary" id="checkSubBtn"></button>
      </div>
      <div class="subscribe-status" id="subscribeStatus"></div>
    </div>

    <textarea id="prompt" placeholder="كتب السؤال ديالك هنا..."></textarea>

    <div class="models" id="modelChips"></div>

    <button class="run" id="runBtn">قارن الجوابات</button>

    <div class="results" id="results"></div>
  </div>

</div>

// Used only if the free-models fetch below fails, so the app still works.

// Populated dynamically from OpenRouter's public models list (free models only).

    subscribeTitle: "Subscribe to Premium",

let currentLang = "ar";
let token = null;
let userEmail = null;
let isSignupMode = false;
let selectedModels = new Set();

function t(key, ...args) {
  const val = I18N[currentLang][key];
  return typeof val === "function" ? val(...args) : val;
}

function setLanguage(lang) {
  if (!I18N[lang]) return;
  currentLang = lang;
  document.getElementById("htmlRoot").lang = lang;
  document.getElementById("htmlRoot").dir = lang === "ar" ? "rtl" : "ltr";

  document.getElementById("pageTitle").textContent = t("pageTitle");
  document.getElementById("mainTitle").textContent = t("mainTitle");
  document.getElementById("subTitle").textContent = t("subTitle");
  document.getElementById("authEmail").placeholder = t("emailPlaceholder");
  document.getElementById("authPassword").placeholder = t("passwordPlaceholder");
  document.getElementById("prompt").placeholder = t("promptPlaceholder");
  document.getElementById("runBtn").textContent = t("runBtn");
  document.getElementById("logoutBtn").textContent = t("logoutBtn");
  document.getElementById("subscribeTitle").textContent = t("subscribeTitle");
  document.getElementById("subscribeDesc").textContent = t("subscribeDesc");
  document.getElementById("subscribeLinkBtnInner").textContent = t("subscribeLinkText");
  document.getElementById("checkSubBtn").textContent = t("checkSubText");

  document.querySelectorAll(".lang-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.lang === lang);
  });

  renderAuthMode();
  if (token) refreshUsage();
}

document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.onclick = () => setLanguage(btn.dataset.lang);
});

// ---------- Auth UI ----------
const authTitle = document.getElementById("authTitle");
const authSubmitBtn = document.getElementById("authSubmitBtn");
const switchText = document.getElementById("switchText");
const switchLink = document.getElementById("switchLink");
const authError = document.getElementById("authError");

function renderAuthMode() {
  if (isSignupMode) {
    authTitle.textContent = t("signupTitle");
    authSubmitBtn.textContent = t("signupBtn");
    switchText.textContent = t("switchToLoginText");
    switchLink.textContent = t("switchToLoginLink");
  } else {
    authTitle.textContent = t("loginTitle");
    authSubmitBtn.textContent = t("loginBtn");
    switchText.textContent = t("switchToSignupText");
    switchLink.textContent = t("switchToSignupLink");
  }
  authError.textContent = "";
}

switchLink.onclick = () => {
  isSignupMode = !isSignupMode;
  renderAuthMode();
};

authSubmitBtn.onclick = async () => {
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  authError.textContent = "";

  if (!email || !password) {
    authError.textContent = t("fillFields");
    return;
  }

  authSubmitBtn.disabled = true;
  authSubmitBtn.textContent = t("working");

  try {
    const endpoint = isSignupMode ? "/api/auth/signup" : "/api/auth/login";
    const res = await fetch(BACKEND_URL + endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (!res.ok) {
      authError.textContent = data.error || t("genericError");
      authSubmitBtn.disabled = false;
      renderAuthMode();
      return;
    }

    token = data.token;
    userEmail = data.email;
    saveSession(token, userEmail);
    showApp();
  } catch (err) {
    authError.textContent = t("connError");
  }

  authSubmitBtn.disabled = false;
  renderAuthMode();
};

// حفظ الجلسة فـ localStorage باش المستخدم يبقى مسجل حتى بعد ما يسد الصفحة أو يعاود يفتحها
function saveSession(tok, email) {
  try {
    localStorage.setItem("azizart_token", tok);
    localStorage.setItem("azizart_email", email);
  } catch (e) {
    // localStorage ماشي متاح (نادر جدا)، التطبيق غيخدم بلا حفظ دائم
  }
}

function clearSession() {
  try {
    localStorage.removeItem("azizart_token");
    localStorage.removeItem("azizart_email");
  } catch (e) {}
}

function loadSession() {
  try {
    return {
      token: localStorage.getItem("azizart_token"),
      email: localStorage.getItem("azizart_email")
    };
  } catch (e) {
    return { token: null, email: null };
  }
}

// ---------- Main App ----------
const modelChips = document.getElementById("modelChips");

function renderModelChips() {
  modelChips.innerHTML = "";
  MODELS.forEach(m => {
    const chip = document.createElement("div");
    chip.className = "chip active";
    chip.textContent = m.label;
    chip.onclick = () => {
      if (selectedModels.has(m.id)) {
        selectedModels.delete(m.id);
        chip.classList.remove("active");
      } else {
        selectedModels.add(m.id);
        chip.classList.add("active");
      }
    };
    modelChips.appendChild(chip);
  });
}

const FAMOUS_PREFIXES = [
  "meta-llama/", "google/", "qwen/", "nvidia/", "mistralai/",
  "moonshotai/", "deepseek/", "microsoft/", "openrouter/"
];

async function loadFreeModels() {
  modelChips.innerHTML = `<span class="muted" id="modelsLoadingMsg">${t("loadingModels")}</span>`;
  try {
    const res = await fetch("https://openrouter.ai/api/v1/models");
    const data = await res.json();
const EXCLUDE_KEYWORDS = ["lyria", "whisper", "tts", "embed", "moderation", "dall-e", "musicgen"];

const free = (data.data || []).filter(m => {
  const p = m.pricing || {};
  const isFree = parseFloat(p.prompt || "0") === 0 && parseFloat(p.completion || "0") === 0;
  const arch = m.architecture || {};
  const outputs = Array.isArray(arch.output_modalities) ? arch.output_modalities : ["text"];
  const isChatText = outputs.includes("text");
  const isFamous = FAMOUS_PREFIXES.some(pfx => m.id.startsWith(pfx));
  const isExcluded = EXCLUDE_KEYWORDS.some(k => m.id.toLowerCase().includes(k));
  return isFree && isChatText && isFamous && !isExcluded;
});

if (free.length === 0) throw new Error("no free models returned");

MODELS = free
  .map(m => ({ id: m.id, label: (m.name || m.id).replace(/\s*\(free\)\s*$/i, "") }))
  .sort((a, b) => {
    const aTop = a.id.startsWith("deepseek/") ? 0 : 1;
    const bTop = b.id.startsWith("deepseek/") ? 0 : 1;
    if (aTop !== bTop) return aTop - bTop;
    return a.label.localeCompare(b.label);
  })
  .slice(0, 8);
  } catch (err) {
    MODELS = FALLBACK_MODELS;
  }

  selectedModels = new Set(MODELS.map(m => m.id));
  renderModelChips();
}

loadFreeModels();

function showApp() {
  document.getElementById("authSection").classList.add("hidden");
  document.getElementById("appSection").classList.remove("hidden");
  document.getElementById("userEmailLabel").textContent = userEmail;
  refreshUsage();
}

document.getElementById("logoutBtn").onclick = () => {
  token = null;
  userEmail = null;
  clearSession();
  document.getElementById("appSection").classList.add("hidden");
  document.getElementById("authSection").classList.remove("hidden");
  document.getElementById("authEmail").value = "";
  document.getElementById("authPassword").value = "";
};

// عند فتح الصفحة، نتحققو واش كاين جلسة محفوظة من قبل ونعاودو تسجيل الدخول أوتوماتيكيا
(function restoreSession() {
  const saved = loadSession();
  if (saved.token && saved.email) {
    token = saved.token;
    userEmail = saved.email;
    showApp();
  }
})();

async function refreshUsage() {
  try {
    const res = await fetch(BACKEND_URL + "/api/usage", {
      headers: { "Authorization": "Bearer " + token }
    });
    if (res.status === 401) {
      token = null;
      userEmail = null;
      clearSession();
      document.getElementById("appSection").classList.add("hidden");
      document.getElementById("authSection").classList.remove("hidden");
      return;
    }
    const data = await res.json();
    const pill = document.getElementById("usagePill");
    const subscribeBox = document.getElementById("subscribeBox");
    const promptBox = document.getElementById("prompt");
    const runBtn = document.getElementById("runBtn");

    if (data.is_premium) {
      pill.textContent = t("premiumLabel");
      subscribeBox.classList.add("hidden");
      promptBox.disabled = false;
      runBtn.disabled = false;
    } else if (data.in_trial) {
      pill.textContent = t("trialLabel", data.trial_days_left);
      subscribeBox.classList.remove("hidden");
      setupSubscribeLink();
      promptBox.disabled = false;
      runBtn.disabled = false;
    } else {
      pill.textContent = t("trialEndedLabel");
      subscribeBox.classList.remove("hidden");
      setupSubscribeLink();
      promptBox.disabled = true;
      runBtn.disabled = true;
    }
  } catch (err) {
    // silent fail
  }
}

// ---------- Gumroad Subscription ----------
let subscribeLinkReady = false;

// كنجيبو رابط المنتج ديال Gumroad من السيرفر ونحطوه فالزر، مع تعمير الإيميل مسبقا
async function setupSubscribeLink() {
  if (subscribeLinkReady) return;

  const statusEl = document.getElementById("subscribeStatus");
  const linkEl = document.getElementById("subscribeLinkBtn");

  try {
    const configRes = await fetch(BACKEND_URL + "/api/payment/config");
    const config = await configRes.json();

    if (!config.productUrl) {
      statusEl.textContent = t("paymentNotReady");
      statusEl.className = "subscribe-status error";
      return;
    }

    // نزيدو الإيميل ديال المستخدم كـ query param باش يتعمر مسبقا فصفحة Gumroad
    const urlWithEmail = config.productUrl +
      (config.productUrl.includes("?") ? "&" : "?") +
      "email=" + encodeURIComponent(userEmail);

    linkEl.href = urlWithEmail;
    subscribeLinkReady = true;
  } catch (err) {
    statusEl.textContent = t("paymentNotReady");
    statusEl.className = "subscribe-status error";
  }
}

// زر "تحققت من الدفع" كيسول directly على /api/usage باش يشوف واش is_premium تبدلات
document.getElementById("checkSubBtn").onclick = async () => {
  const statusEl = document.getElementById("subscribeStatus");
  statusEl.textContent = t("checkingSub");
  statusEl.className = "subscribe-status";

  try {
    const res = await fetch(BACKEND_URL + "/api/usage", {
      headers: { "Authorization": "Bearer " + token }
    });
    const data = await res.json();

    if (data.is_premium) {
      statusEl.textContent = t("subSuccess");
      statusEl.className = "subscribe-status success";
      refreshUsage();
    } else {
      statusEl.textContent = t("subNotYet");
      statusEl.className = "subscribe-status";
    }
  } catch (err) {
    statusEl.textContent = t("subCheckError");
    statusEl.className = "subscribe-status error";
  }
};

document.getElementById("runBtn").onclick = async () => {
  const prompt = document.getElementById("prompt").value.trim();
  const resultsEl = document.getElementById("results");
  const btn = document.getElementById("runBtn");
  const limitBanner = document.getElementById("limitBanner");
  limitBanner.classList.add("hidden");

  if (!prompt) { alert(t("emptyPromptAlert")); return; }
  if (selectedModels.size === 0) { alert(t("noModelAlert")); return; }

  resultsEl.innerHTML = "";
  btn.disabled = true;
  btn.textContent = t("runningBtn");

  const activeModels = MODELS.filter(m => selectedModels.has(m.id));

  activeModels.forEach(m => {
    const card = document.createElement("div");
    card.className = "card";
    card.id = "card-" + m.id.replace(/[^a-z0-9]/gi, "-");
    card.innerHTML = `<h3>${m.label}</h3><div class="body muted">${t("working")}</div>`;
    resultsEl.appendChild(card);
  });

  let hitLimit = false;

  for (const m of activeModels) {
    const card = document.getElementById("card-" + m.id.replace(/[^a-z0-9]/gi, "-"));
    try {
      const res = await fetch(BACKEND_URL + "/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ model: m.id, prompt })
      });
      const data = await res.json();

      if (res.status === 429) {
        card.querySelector(".body").textContent = t("limitReachedShort");
        hitLimit = true;
        limitBanner.textContent = data.error;
        limitBanner.classList.remove("hidden");
        continue;
      }

      if (data.error) {
        card.querySelector(".body").textContent = t("errorPrefix") + data.error;
      } else {
        card.querySelector(".body").textContent = data.text;
        card.querySelector(".body").classList.remove("muted");
      }
    } catch (err) {
      card.querySelector(".body").textContent = t("connErrorPrefix") + err.message;
    }
  }

  btn.disabled = false;
  btn.textContent = t("runBtn");
  refreshUsage();
};

setLanguage("ar");
</script>
