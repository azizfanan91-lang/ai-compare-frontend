<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="hT2FDh9OExjZR-fDaO2KDz0Flq1Nl5_4GmiH-NgwvW0" />
<title id="pageTitle">QueryMix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f7fd; --card:#ffffff; --ink:#1f2340; --muted:#6b7090; --line:#ebe8f7;
  --p1:#8b6be0; --p2:#6444c7; --blue:#4b8df2; --soft:#efeafc; --ok:#1f9d6b; --err:#d64550;
  --shadow:0 6px 24px rgba(100,68,199,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;
  background-image:radial-gradient(900px 400px at 85% -5%,#e9e2fb 0,transparent 70%),radial-gradient(700px 400px at 0% 30%,#e4edfd 0,transparent 70%);
  background-repeat:no-repeat}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid #b9a6f3;outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* Navbar */
.nav{position:sticky;top:12px;z-index:50;margin:12px auto 0;max-width:1180px;padding:0 20px}
.nav-in{background:var(--card);border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;padding:14px 26px;gap:16px;position:relative}
.logo{font-size:26px;font-weight:700;display:flex;gap:6px;align-items:baseline;direction:ltr}
.logo b{color:var(--p2)}
.links{display:flex;gap:30px;font-weight:500}
.links a{padding:6px 2px;border-bottom:2px solid transparent}
.links a:hover{color:var(--p2);border-color:var(--p2)}
.nav-end{display:flex;align-items:center;gap:12px}
.lang{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:12px;padding:4px 10px;border-radius:999px}
.lang button.active{background:var(--p2);color:#fff}
.btn{border:0;border-radius:12px;padding:12px 24px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .15s}
.btn-p{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:0 8px 20px rgba(100,68,199,.28)}
.btn-p:hover:not(:disabled){transform:translateY(-2px)}
.btn-w{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn-w:hover{border-color:var(--p1)}
.btn-sm{padding:9px 18px;font-size:15px}
.arrow::before{content:"‹"}
html[dir="ltr"] .arrow::before{content:"›"}
.menu-btn{display:none;background:none;border:0;font-size:26px;color:var(--ink)}

/* Hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:64px 0 34px}
.hero h1{font-size:clamp(36px,5.4vw,62px);line-height:1.25;font-weight:700}
.hero p{color:var(--muted);font-size:19px;margin:20px 0 30px;max-width:540px}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap}
.visual{position:relative;min-height:340px}
.win{background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(100,68,199,.16);padding:18px;position:absolute;inset-block:20px;inset-inline:30px 10px;display:flex;flex-direction:column}
.dots{display:flex;gap:6px;margin-bottom:14px}.dots i{width:9px;height:9px;border-radius:50%;background:#e4defa}
.tiles{flex:1;display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:1fr 1fr;gap:12px}
.tile{background:var(--bg);border-radius:14px;padding:12px}
.t-text{grid-row:span 2;display:flex;flex-direction:column;gap:9px}
.t-text u{display:block;height:8px;border-radius:4px;background:#dcd5f6}
.t-text u:nth-child(2){width:85%}.t-text u:nth-child(3){width:95%}.t-text u:nth-child(4){width:60%}.t-text u:nth-child(5){width:78%}.t-text u:nth-child(6){width:70%}
.t-img{display:grid;place-items:center;color:#b7a5ee}
.t-bars{display:flex;align-items:flex-end;gap:8px}
.t-bars i{flex:1;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--blue),#8fb9f7)}
.float{position:absolute;width:54px;height:54px;border-radius:15px;display:grid;place-items:center;color:#fff;font-size:24px;box-shadow:0 10px 24px rgba(100,68,199,.25)}
.f1{top:0;inset-inline-end:0;background:linear-gradient(135deg,#c78af0,#8b6be0)}
.f2{bottom:0;inset-inline-end:10px;background:linear-gradient(135deg,#5aa0ff,#3d78e0)}
.f3{top:120px;inset-inline-start:-6px;background:linear-gradient(135deg,#66b6ff,#4b8df2)}

/* Tool cards */
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:24px 0 40px}
.feat{background:var(--card);border:0;border-radius:18px;padding:22px;box-shadow:var(--shadow);display:flex;gap:16px;align-items:flex-start;text-align:start;color:var(--ink);transition:transform .15s}
.feat:hover{transform:translateY(-3px)}
.ico{flex:none;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:24px}
.feat h3{font-size:18px;margin-bottom:4px}
.feat p{color:var(--muted);font-size:14.5px;line-height:1.65}

/* Tools workspace */
.section-title{font-size:28px;font-weight:700;text-align:center;margin-bottom:8px}
.section-sub{text-align:center;color:var(--muted);margin-bottom:28px}
.tool{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px;margin-bottom:56px}
.status{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;font-size:14.5px;margin-bottom:16px}
.pill{background:var(--soft);color:var(--p2);font-weight:600;border-radius:999px;padding:4px 14px}
.email{color:var(--muted);font-size:14px;direction:ltr}
.banner{background:#fdecee;border:1px solid var(--err);color:var(--err);padding:12px 16px;border-radius:12px;font-size:14px;margin-bottom:16px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:16px}
.tab{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 18px;font-weight:600;font-size:15px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--soft);color:var(--p2);border-color:var(--p1)}
.models-label{font-size:14px;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;padding:2px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-color:transparent}
.ta{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;font-size:16px;resize:vertical;min-height:130px;background:var(--bg);color:var(--ink)}
.ta:focus,.sel:focus,.inp:focus{outline:none;border-color:var(--p1);background:#fff}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;background:var(--bg);color:var(--ink);margin-top:10px}
.opts{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin:12px 0}
.opt{display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
.sel{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;font-size:15px;background:var(--bg);color:var(--ink);min-width:150px}
.file input{display:none}
.file{cursor:pointer}
.run{margin-top:4px}
.hint{color:var(--muted);font-size:13.5px;margin-top:10px}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:22px}
.res{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}
.res-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.res h4{font-size:15px;color:var(--p2)}
.copy{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12.5px;padding:3px 10px;color:var(--muted)}
.copy:hover{border-color:var(--p1);color:var(--p2)}
.res .body{white-space:pre-wrap;font-size:15px;line-height:1.75;max-height:460px;overflow:auto}
.res .body.muted{color:var(--muted)}
.muted{color:var(--muted);font-size:14px}

.res img{width:100%;height:auto;border-radius:12px;display:block}
.res .body.bad{color:var(--err)}
.res .ph{min-height:120px;display:grid;place-items:center;text-align:center}
.img-out{margin-top:20px;display:grid;gap:12px;justify-items:center}
.img-frame{width:100%;max-width:560px;background:var(--bg);border:1px solid var(--line);border-radius:18px;display:grid;place-items:center;overflow:hidden;min-height:180px;text-align:center;padding:10px}
.img-frame img{width:100%;height:auto;border-radius:12px;display:block}

/* Steps */
.steps-box{background:var(--card);border-radius:22px;padding:28px;box-shadow:var(--shadow);margin-bottom:40px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}
.step{background:var(--bg);border-radius:16px;padding:18px}
.num{width:30px;height:30px;border-radius:50%;background:var(--p1);color:#fff;font-weight:700;display:grid;place-items:center;margin-bottom:10px}
.step:nth-child(2) .num{background:var(--blue)}.step:nth-child(3) .num{background:var(--p2)}.step:nth-child(4) .num{background:#37b5a3}
.step h4{font-size:17px}.step p{color:var(--muted);font-size:14.5px}

/* Pricing */
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,360px));gap:22px;justify-content:center;margin-bottom:56px}
.plan{background:var(--card);border-radius:22px;padding:28px;box-shadow:var(--shadow);border:2px solid transparent;display:flex;flex-direction:column}
.plan.hot{border-color:var(--p1)}
.plan h3{font-size:20px}
.price{font-size:40px;font-weight:700;margin:8px 0}.price small{font-size:16px;color:var(--muted);font-weight:500}
.plan ul{list-style:none;margin:16px 0 22px;display:grid;gap:8px;color:var(--muted);flex:1}
.plan li::before{content:"✓";color:var(--ok);font-weight:700;margin-inline-end:8px}
.plan .btn{width:100%}
.sub-actions{display:grid;gap:8px}
.sub-status{font-size:13.5px;margin-top:10px;min-height:20px;color:var(--muted)}
.sub-status.success{color:var(--ok)}.sub-status.error{color:var(--err)}
.prem-ok{background:var(--soft);color:var(--p2);font-weight:600;text-align:center;border-radius:12px;padding:12px}

/* CTA */
.cta{background:linear-gradient(120deg,#ddd5fa,#dbe7fd);border-radius:22px;padding:30px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:34px}
.cta h2{font-size:26px}.cta p{opacity:.8}
footer{text-align:center;color:var(--muted);font-size:14px;padding:10px 0 40px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(31,35,64,.5);display:none;place-items:center;z-index:100;padding:20px}
.modal.open{display:grid}
.box{background:#fff;border-radius:22px;padding:28px;width:100%;max-width:400px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.box h3{font-size:22px;margin-bottom:6px}
.box input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;background:var(--bg);margin-top:12px;color:var(--ink)}
.box input:focus{outline:none;border-color:var(--p1);background:#fff}
.box .btn{width:100%;margin-top:14px}
.switch{text-align:center;margin-top:14px;font-size:14px;color:var(--muted)}
.switch a{color:var(--p2);font-weight:600;cursor:pointer;text-decoration:underline}
.err{color:var(--err);font-size:14px;margin-top:10px;min-height:20px}
.close{float:inline-end;background:none;border:0;font-size:22px;color:var(--muted)}

@media (max-width:980px){
  .hero{grid-template-columns:1fr;padding-top:40px}.visual{min-height:280px;order:-1}
  .feats,.steps{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .links{display:none;position:absolute;top:66px;inset-inline:0;background:#fff;border-radius:16px;box-shadow:var(--shadow);flex-direction:column;gap:6px;padding:16px;z-index:5}
  .links.open{display:flex}.menu-btn{display:block}
}
@media (max-width:720px){
  .feats,.steps,.plans{grid-template-columns:1fr}
  .cta{padding:24px}.tool{padding:18px}
  .nav-in{padding:12px 14px;gap:8px}.logo{font-size:22px}
  .nav-end{gap:8px}.btn-sm{padding:8px 12px;font-size:14px}
  .tab{padding:8px 12px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-in">
    <a href="#home" class="logo"><b>Mix</b>Query</a>
    <nav class="links" id="links">
      <a href="#home" data-i18n="navHome"></a>
      <a href="#tools" data-i18n="navTools"></a>
      <a href="#how" data-i18n="navHow"></a>
      <a href="#pricing" data-i18n="navPricing"></a>
    </nav>
    <div class="nav-end">
      <div class="lang" role="group" aria-label="Language">
        <button class="lang-btn" data-lang="ar">ع</button>
        <button class="lang-btn" data-lang="fr">FR</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <button class="btn btn-p btn-sm" id="authBtn"></button>
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<main class="wrap" id="home">

  <section class="hero">
    <div>
      <h1 data-i18n="heroTitle"></h1>
      <p data-i18n="heroText"></p>
      <div class="hero-btns">
        <a href="#tools" class="btn btn-p"><span class="arrow"></span> <span data-i18n="heroCta1"></span></a>
        <a href="#toolcards" class="btn btn-w"><span class="arrow"></span> <span data-i18n="heroCta2"></span></a>
      </div>
    </div>
    <div class="visual" aria-hidden="true">
      <div class="win">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="tiles">
          <div class="tile t-text"><u></u><u></u><u></u><u></u><u></u><u></u></div>
          <div class="tile t-img">
            <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><rect x="6" y="10" width="52" height="44" rx="8" stroke="currentColor" stroke-width="4"/><circle cx="22" cy="26" r="5" fill="currentColor"/><path d="M10 48l16-14 10 8 10-10 10 12" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>
          </div>
          <div class="tile t-bars"><i style="height:35%"></i><i style="height:60%"></i><i style="height:45%"></i><i style="height:85%"></i></div>
        </div>
      </div>
      <div class="float f1">✎</div>
      <div class="float f2">◔</div>
      <div class="float f3">✦</div>
    </div>
  </section>

  <section class="feats" id="toolcards">
    <button class="feat" data-tool="edit"><div class="ico" style="background:linear-gradient(135deg,#a582ee,#7a55d6)">✎</div>
      <div><h3 data-i18n="tEditT"></h3><p data-i18n="tEditD"></p></div></button>
    <button class="feat" data-tool="image"><div class="ico" style="background:linear-gradient(135deg,#66b6ff,#3d78e0)">▣</div>
      <div><h3 data-i18n="tImgT"></h3><p data-i18n="tImgD"></p></div></button>
    <button class="feat" data-tool="data"><div class="ico" style="background:linear-gradient(135deg,#9a7ae8,#6f4fd0)">▥</div>
      <div><h3 data-i18n="tDataT"></h3><p data-i18n="tDataD"></p></div></button>
    <button class="feat" data-tool="summary"><div class="ico" style="background:linear-gradient(135deg,#4fa2f0,#2f7ad8)">≡</div>
      <div><h3 data-i18n="tSumT"></h3><p data-i18n="tSumD"></p></div></button>
  </section>

  <section id="tools">
    <h2 class="section-title" data-i18n="toolsTitle"></h2>
    <p class="section-sub" data-i18n="toolsSub"></p>
    <div class="tool">
      <div class="status">
        <span class="pill" id="usagePill">...</span>
        <span class="email" id="userEmailLabel"></span>
      </div>
      <div id="trialBanner" class="banner hidden"></div>
      <div id="limitBanner" class="banner hidden"></div>

      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tool="edit" data-i18n="tEditT"></button>
        <button class="tab" role="tab" data-tool="image" data-i18n="tImgT"></button>
        <button class="tab" role="tab" data-tool="data" data-i18n="tDataT"></button>
        <button class="tab" role="tab" data-tool="summary" data-i18n="tSumT"></button>
      </div>

      <div id="modelsBox">
        <div class="models-label" data-i18n="modelsLabel"></div>
        <div class="chips" id="modelChips"></div>
      </div>

      <!-- تحرير النصوص -->
      <div data-panel="edit">
        <div class="opts">
          <label class="opt"><span data-i18n="editKind"></span>
            <select class="sel" id="editAction">
              <option value="fix" data-i18n="actFix"></option>
              <option value="improve" data-i18n="actImprove"></option>
              <option value="rephrase" data-i18n="actRephrase"></option>
              <option value="shorter" data-i18n="actShort"></option>
              <option value="longer" data-i18n="actLong"></option>
              <option value="formal" data-i18n="actFormal"></option>
              <option value="friendly" data-i18n="actFriendly"></option>
            </select>
          </label>
        </div>
        <textarea class="ta" id="editText" data-i18n-ph="editPh"></textarea>
        <button class="btn btn-p run" id="editRun" data-i18n="editRun" style="margin-top:12px"></button>
        <div class="results" id="editResults" aria-live="polite"></div>
      </div>

      <!-- توليد الصور -->
      <div data-panel="image" class="hidden">
        <div class="models-label" data-i18n="imgModelsLabel"></div>
        <div class="chips" id="imgModelChips"></div>
        <textarea class="ta" id="imgPrompt" data-i18n-ph="imgPh" maxlength="500" style="min-height:100px"></textarea>
        <div class="opts">
          <label class="opt"><span data-i18n="imgStyle"></span>
            <select class="sel" id="imgStyleSel">
              <option value="none" data-i18n="stNone"></option>
              <option value="real" data-i18n="stReal"></option>
              <option value="digital" data-i18n="stDigital"></option>
              <option value="anime" data-i18n="stAnime"></option>
              <option value="3d" data-i18n="st3d"></option>
              <option value="water" data-i18n="stWater"></option>
            </select>
          </label>
          <label class="opt"><span data-i18n="imgSize"></span>
            <select class="sel" id="imgSizeSel">
              <option value="1024x1024" data-i18n="szSquare"></option>
              <option value="1280x720" data-i18n="szWide"></option>
              <option value="720x1280" data-i18n="szTall"></option>
            </select>
          </label>
        </div>
        <button class="btn btn-p run" id="imgRun" data-i18n="imgRun"></button>
        <p class="hint" data-i18n="imgNote"></p>
        <div class="results" id="imgResults" aria-live="polite"></div>
      </div>

      <!-- تحليل البيانات -->
      <div data-panel="data" class="hidden">
        <label class="btn btn-w btn-sm file"><input type="file" id="dataFile" accept=".csv,.tsv,.txt,.json"><span data-i18n="uploadCsv"></span></label>
        <textarea class="ta" id="dataText" data-i18n-ph="dataPh" style="margin-top:12px"></textarea>
        <input class="inp" id="dataQ" data-i18n-ph="dataQPh" maxlength="300">
        <button class="btn btn-p run" id="dataRun" data-i18n="dataRun" style="margin-top:12px"></button>
        <p class="hint" data-i18n="dataNote"></p>
        <div class="results" id="dataResults" aria-live="polite"></div>
      </div>

      <!-- تلخيص النصوص -->
      <div data-panel="summary" class="hidden">
        <label class="btn btn-w btn-sm file"><input type="file" id="sumFile" accept=".txt,.md,.csv,.json"><span data-i18n="uploadTxt"></span></label>
        <textarea class="ta" id="sumText" data-i18n-ph="sumPh" style="margin-top:12px"></textarea>
        <div class="opts">
          <label class="opt"><span data-i18n="sumLen"></span>
            <select class="sel" id="sumLenSel">
              <option value="short" data-i18n="lenShort"></option>
              <option value="medium" data-i18n="lenMedium" selected></option>
              <option value="long" data-i18n="lenLong"></option>
            </select>
          </label>
          <label class="opt"><span data-i18n="sumFmt"></span>
            <select class="sel" id="sumFmtSel">
              <option value="para" data-i18n="fmtPara"></option>
              <option value="bullets" data-i18n="fmtBullets"></option>
            </select>
          </label>

    localStorage.setItem("azizart_email", email);

}
function clearSession() {
  try {
    localStorage.removeItem("azizart_token");

}

  try {
    return { token: localStorage.getItem("azizart_token"), email: localStorage.getItem("azizart_email") };
  } catch (e) {

const FAMOUS_PREFIXES = [
  "meta-llama/", "google/", "qwen/", "nvidia/", "mistralai/",
  "moonshotai/", "deepseek/", "microsoft/", "openrouter/"
];
const EXCLUDE_KEYWORDS = ["lyria", "whisper", "tts", "embed", "moderation", "dall-e", "musicgen", "nano-omni", "3-super"];

async function loadFreeModels() {
  modelChips.innerHTML = `<span class="muted">${t("loadingModels")}</span>`;
  try {
    const res = await fetch("https://openrouter.ai/api/v1/models");
    const data = await res.json();

    const free = (data.data || []).filter(m => {
      const p = m.pricing || {};
      const isFree = parseFloat(p.prompt || "0") === 0 && parseFloat(p.completion || "0") === 0;
      const arch = m.architecture || {};
      const outputs = Array.isArray(arch.output_modalities) ? arch.output_modalities : ["text"];
      const isChatText = outputs.includes("text");
      const isFamous = FAMOUS_PREFIXES.some(pfx => m.id.startsWith(pfx));
      const isExcluded = EXCLUDE_KEYWORDS.some(k => m.id.toLowerCase().includes(k));
      return isFree && isChatText && isFamous && !isExcluded;
    });

    if (free.length === 0) throw new Error("no free models returned");

    MODELS = free
      .map(m => ({ id: m.id, label: (m.name || m.id).replace(/\s*\(free\)\s*$/i, "") }))
      .sort((a, b) => {
        const aTop = a.id.startsWith("deepseek/") ? 0 : 1;
        const bTop = b.id.startsWith("deepseek/") ? 0 : 1;
        if (aTop !== bTop) return aTop - bTop;
        return a.label.localeCompare(b.label);
      })
      .slice(0, 8);
  } catch (err) {
    MODELS = FALLBACK_MODELS;
  }

  selectedModels = new Set(MODELS.slice(0, DEFAULT_SELECTED).map(m => m.id));
  renderModelChips();
}

function showApp() {

  logout();

function isLocked() {
  return !!token && !!lastUsage && !lastUsage.is_premium && !lastUsage.in_trial;
}

function syncButtons() {
  const lock = isLocked();

function renderUsage() {
  const pill = $("usagePill");
  const actions = $("subActions");
  const premOk = $("premiumOk");
  const banner = $("trialBanner");
  banner.classList.add("hidden");

  if (!token) {

    premOk.classList.add("hidden");
    syncButtons();

    banner.classList.remove("hidden");
    actions.classList.remove("hidden");
    premOk.classList.add("hidden");

      headers: { "Authorization": "Bearer " + token }

    lastUsage = await res.json();

// يتحقق من الدخول والتجربة قبل أي أداة
function guard(needModels) {
  if (!token) { openAuth(true); return false; }
  if (isLocked()) { $("pricing").scrollIntoView(); return false; }
  if (needModels && selectedModels.size === 0) { alert(t("noModelAlert")); return false; }
  return true;
}

function clip(text, max) {
  return text.length > max ? { text: text.slice(0, max), cut: true } : { text, cut: false };
}

function bindFile(inputId, areaId) {
  $(inputId).addEventListener("change", () => {
    const f = $(inputId).files[0];
    if (!f) return;
    if (f.size > MAX_FILE_BYTES) { alert(t("fileTooBig")); $(inputId).value = ""; return; }
    const r = new FileReader();
    r.onload = () => { $(areaId).value = String(r.result); };
    r.onerror = () => alert(t("fileReadErr"));
    r.readAsText(f);
    $(inputId).value = "";
  });
}
bindFile("dataFile", "dataText");
bindFile("sumFile", "sumText");

// يرسل نفس الطلب لكل النماذج المختارة، واحداً تلو الآخر (كما كان سابقاً)
async function runOnModels(prompt, resultsEl, btn, noteText) {
  const limitBanner = $("limitBanner");
  limitBanner.classList.add("hidden");
  resultsEl.innerHTML = "";

  if (noteText) {
    const n = document.createElement("div");
    n.className = "muted";
    n.style.gridColumn = "1 / -1";
    n.textContent = noteText;
    resultsEl.appendChild(n);
  }

  running = true;
  syncButtons();
  btn.textContent = t("runningBtn");

  const activeModels = MODELS.filter(m => selectedModels.has(m.id));
  const cards = new Map();

  activeModels.forEach(m => {
    const card = document.createElement("div");
    card.className = "res";
    const head = document.createElement("div");
    head.className = "res-head";
    const h = document.createElement("h4");
    h.textContent = m.label;
    const copy = document.createElement("button");
    copy.type = "button";
    copy.className = "copy hidden";
    copy.textContent = t("copyBtn");
    head.append(h, copy);
    const body = document.createElement("div");
    body.className = "body muted";
    body.textContent = t("working");
    card.append(head, body);
    resultsEl.appendChild(card);
    cards.set(m.id, { body, copy });
  });

  for (const m of activeModels) {
    const { body, copy } = cards.get(m.id);
    try {
      const res = await fetch(BACKEND_URL + "/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ model: m.id, prompt })
      });
      const data = await res.json();

      if (res.status === 401) { sessionExpired(); break; }

      if (res.status === 429) {
        body.textContent = t("limitReachedShort");
        limitBanner.textContent = data.error;
        limitBanner.classList.remove("hidden");
        continue;
      }

      if (data.error) {
        body.textContent = t("errorPrefix") + data.error;
      } else {
        body.textContent = data.text;
        body.classList.remove("muted");
        copy.classList.remove("hidden");
        copy.onclick = async () => {
          try {
            await navigator.clipboard.writeText(body.textContent);
            copy.textContent = t("copiedBtn");
            setTimeout(() => { copy.textContent = t("copyBtn"); }, 1500);
          } catch (e) {}
        };
      }
    } catch (err) {
      body.textContent = t("connErrorPrefix") + err.message;
    }
  }

  running = false;
  btn.textContent = t(btn.dataset.i18n);
  syncButtons();
  refreshUsage();
}

  improve: "Improve the clarity, flow and style of the text while keeping its meaning.",
  rephrase: "Rewrite the text using different wording while keeping the same meaning.",

$("sumRun").onclick = () => {

// ---------- Tool 3: تحليل البيانات ----------
function describeData(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
  const first = lines[0] || "";
  const counts = { ",": 0, ";": 0, "\t": 0, "|": 0 };
  for (const ch of first) if (ch in counts) counts[ch]++;
  const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  const cols = best[1] > 0 ? best[1] + 1 : 1;
  return { rows: lines.length, cols };
}

$("dataRun").onclick = () => {
  if (!guard(true)) return;
  const raw = $("dataText").value.trim();
  if (!raw) { alert(t("emptyDataAlert")); return; }
  const info = describeData(raw);
  const { text, cut } = clip(raw, MAX_DATA_CHARS);
  const question = $("dataQ").value.trim() ||
    "Describe the dataset, give key statistics, point out notable patterns or anomalies, and finish with 3 actionable insights.";
  const prompt =
`You are a careful data analyst. The dataset below has about ${info.rows} lines (including a header if present) and about ${info.cols} columns.${cut ? " Only the first part of the data is shown, so say clearly that your findings are based on a partial sample." : ""}
Task: ${question}
Rules: use only the data provided; show briefly how you got each number; never invent values; say so if the data is insufficient to answer. Reply in ${LANG_NAMES[currentLang]}.

Data:
"""
${text}
"""`;
  runOnModels(prompt, $("dataResults"), $("dataRun"), cut ? t("truncated") : "");
};

  "3d": "3D render, soft lighting, high quality",

};

const DEFAULT_IMG_SELECTED = 2;
// تُستعمل فقط إذا تعذّر الوصول لـ /api/image/models فـ السيرفر، باش الأداة تبقى خدامة
const FALLBACK_IMAGE_MODELS = [
  { id: "flux", label: "Flux" },
  { id: "turbo", label: "Turbo" },
  { id: "qwen/qwen-image", label: "Qwen Image" }
];
let IMAGE_MODELS = [];

function renderImgChips() {

    IMAGE_MODELS = FALLBACK_IMAGE_MODELS;

  out.innerHTML = "";

  const btn = $("imgRun");
  running = true;
  syncButtons();
  btn.textContent = t("runningBtn");

  const cards = new Map();
  models.forEach(m => {
    const card = document.createElement("div");
    card.className = "res";
    const head = document.createElement("div");
    head.className = "res-head";
    const title = document.createElement("h4");
    title.textContent = m.label || m.id;
    const save = document.createElement("button");
    save.type = "button";
    save.className = "copy hidden";
    save.textContent = t("imgSave");
    head.append(title, save);
    const body = document.createElement("div");
    body.className = "body ph muted";
    body.textContent = t("imgLoading");
    card.append(head, body);
    out.appendChild(card);
    cards.set(m.id, { body, save });
  });

  for (const m of models) {
    const { body, save } = cards.get(m.id);
    try {
      const res = await fetch(BACKEND_URL + "/api/image", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ model: m.id, prompt: full, width: w, height: h })
      });
      if (res.status === 401) { sessionExpired(); break; }
      if (!res.ok) {
        let msg = "";
        try { msg = (await res.json()).error; } catch (e) {}
        throw new Error(msg || t("imgError"));
      }
      const blob = await res.blob();
      if (!blob.type.startsWith("image/")) throw new Error(t("imgError"));
      const url = URL.createObjectURL(blob);
      imgObjectUrls.push(url);
      const img = document.createElement("img");
      img.src = url;
      img.alt = p;
      body.className = "body";
      body.replaceChildren(img);
      const ext = (blob.type.split("/")[1] || "png").replace("jpeg", "jpg").split("+")[0];
      save.classList.remove("hidden");
      save.onclick = () => {
        const a = document.createElement("a");
        a.href = url;
        a.download = `querymix-${Date.now()}.${ext}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      };
    } catch (err) {
      body.className = "body ph bad";
      body.textContent = err.message || t("imgError");
    }
  }

  running = false;
  btn.textContent = t("imgRun");
  syncButtons();
};

// ---------- Init ----------
setTool("edit");
setLanguage("ar");
loadFreeModels();
loadImageModels();
</script>
</body>
</html>
